{% extends "base.html" %}
{% block title %}{{ doc.title }}{% endblock %}
{% block content %}
<article class="card doc-view">
  <a class="back" href="{{ url_for('index') }}">← К поиску</a>
  <h1>{{ doc.title }}</h1>
  <p class="muted">Документ №{{ doc.document_id }} · добавлен {{ doc.date }} в {{ doc.time }} ·
     источник: {{ doc.source }} · объём: {{ words }} слов</p>
  <div class="text">{{ doc.text }}</div>
</article>
{% endblock %}

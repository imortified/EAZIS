<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ИПС{% endblock %} · ИПС «Вариант 25»</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="brand">Информационно поисковая система</div>
  <nav>
    <a href="{{ url_for('index') }}">Поиск</a>
    <a href="{{ url_for('documents_page') }}">Документы</a>
    <a href="{{ url_for('metrics_page') }}">Оценка</a>
    <a href="{{ url_for('help_page') }}">Помощь</a>
  </nav>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, m in messages %}
    <div class="flash {{ cat }}">{{ m }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
